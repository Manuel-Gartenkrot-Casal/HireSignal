services:

  mongo:
    image: mongo:7
    container_name: hiresignal_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - hiresignal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scrapers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiresignal_scrapers
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - MONGO_URI=mongodb://mongo:27017/hiresignal
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - hiresignal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: hiresignal_dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/hiresignal
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - hiresignal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:

networks:
  hiresignal:
    driver: bridge