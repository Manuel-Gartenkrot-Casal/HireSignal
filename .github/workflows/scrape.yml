name: Scrape (HireSignal Feed)

on:
  schedule:
    # Lunes 08:00 UTC (YAML crontab, zona UTC)
    - cron: "0 8 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "hire_signal/**"
      - "requirements.txt"
      - "scripts/github_action.py"
      - ".github/workflows/scrape.yml"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB: ${{ secrets.MONGO_DB }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar credenciales de Google Sheets (si configuradas)
        if: env.GOOGLE_SHEET_ID != ''
        env:
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        run: |
          if [ -n "$GOOGLE_SHEETS_CREDS" ]; then
            printf '%s' "$GOOGLE_SHEETS_CREDS" > "$RUNNER_TEMP/service-account.json"
            echo "GOOGLE_SHEETS_CREDS_PATH=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"
            echo "Credenciales de Google Sheets preparadas."
          else
            echo "Sin secret GOOGLE_SHEETS_CREDS; se omite el export a Sheets (no es un error)."
          fi

      - name: Correr scraping y guardar en MongoDB
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/github_action.py